name: Build Yu-OS ISO
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    # This instructs GitHub to boot directly into an official Arch Linux machine
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure and Compile Custom Arch Linux ISO
        run: |
          # 1. Update keys and bypass container sandboxing privilege limits
          echo 'DisableSandbox' >> /etc/pacman.conf
          pacman-key --init
          pacman-key --populate archlinux
          
          # 2. Re-route package downloads to the Cloudflare content mirror network
          mkdir -p pacman.d syslinux grub output
          echo 'Server = https://cloudflaremirror.com' > /etc/pacman.d/mirrorlist
          
          # 3. Synchronize signature libraries and install building hooks natively
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm archiso squashfs-tools xorriso grub syslinux efibootmgr

          # 4. Generate local pacman config to match the build profile
          cat << 'EOF' > ./pacman.conf
          [options]
          HoldPkg     = pacman glibc
          Architecture = auto
          Color
          CheckSpace
          ParallelDownloads = 5
          SigLevel    = Required DatabaseOptional
          LocalFileSigLevel = Optional
          DisableSandbox

          [core]
          Include = pacman.d/mirrorlist

          [extra]
          Include = pacman.d/mirrorlist
          EOF

          # 5. Populate standard boot configuration layouts with the emergency mode bypass
          echo 'insmod part_gpt' > grub/grub.cfg
          echo 'insmod part_msdos' >> grub/grub.cfg
          echo 'insmod fat' >> grub/grub.cfg
          echo 'insmod iso9660' >> grub/grub.cfg
          echo 'set timeout=5' >> grub/grub.cfg
          echo 'set default=0' >> grub/grub.cfg
          echo 'menuentry "Yu-OS Live Environment" {' >> grub/grub.cfg
          echo '    search --no-floppy --set=root --label YU_OS_202610' >> grub/grub.cfg
          echo '    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=YU_OS_202610 systemd.debug-shell=1' >> grub/grub.cfg
          echo '    initrd /arch/boot/x86_64/initramfs-linux.img' >> grub/grub.cfg
          echo '}' >> grub/grub.cfg

          echo 'DEFAULT yu_os' > syslinux/syslinux.cfg
          echo 'TIMEOUT 50' >> syslinux/syslinux.cfg
          echo 'PROMPT 0' >> syslinux/syslinux.cfg
          echo 'LABEL yu_os' >> syslinux/syslinux.cfg
          echo 'MENU LABEL Yu-OS Live Environment' >> syslinux/syslinux.cfg
          echo 'LINUX /arch/boot/x86_64/vmlinuz-linux' >> syslinux/syslinux.cfg
          echo 'INITRD /arch/boot/x86_64/initramfs-linux.img' >> syslinux/syslinux.cfg
          echo 'APPEND archisobasedir=arch archisolabel=YU_OS_202610 systemd.debug-shell=1' >> syslinux/syslinux.cfg
          
          # 6. Apply profile permission settings and compile the ISO file!
          chmod +x ./profiledef.sh
          mkarchiso -v -w /tmp/archiso-work -o ./output .

      - name: Upload Bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: Yu-OS-Bootable-ISO
          path: output/*.iso
