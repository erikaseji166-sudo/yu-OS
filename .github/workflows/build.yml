name: Build Yu-OS ISO
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ArchISO inside Docker
        run: |
          docker run --privileged --rm -v ${{ github.workspace }}:/workspace -w /workspace archlinux:latest bash -c "
            # 1. Initialize keys and install core packages inside the builder
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Syu --noconfirm archiso squashfs-tools xorriso grub syslinux efibootmgr
            
            # 2. Automatically create the empty configuration directories that mkarchiso expects
            mkdir -p syslinux grub pacman.d
            
            # 3. Setup the download servers map
            echo 'Server = https://pkgbuild.com\$repo/os/\$arch' > pacman.d/mirrorlist
            
            # 4. Make sure your profile script is runnable
            chmod +x ./profiledef.sh
            
            # 5. Compile everything into a bootable ISO file
            mkarchiso -v -w /tmp/archiso-work -o /workspace/output .
          "

      - name: Upload Bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: Yu-OS-Bootable-ISO
          path: output/*.iso
